<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StS2 Workout Mode Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: rgba(10, 14, 23, 0.35);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #e2e8f0;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    /* Hover Stepper Styles for Overlay B Stat Cards */
    .stat-card {
      position: relative;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .stat-card:hover {
      background: rgba(0, 0, 0, 0.42) !important;
      border: 1px solid rgba(255, 255, 255, 0.22) !important;
    }
    .stat-hover-btn {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease, background 0.15s ease, transform 0.1s ease;
      -webkit-app-region: no-drag;
    }
    .stat-card:hover .stat-hover-btn {
      opacity: 1;
      pointer-events: auto;
    }
    .stat-hover-btn:hover {
      background: rgba(255, 255, 255, 0.35) !important;
      transform: scale(1.08);
    }
    .stat-hover-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.5) !important;
    }

    /* Custom In-DOM Dropdown Styles */
    .custom-dropdown-trigger {
      -webkit-app-region: no-drag;
      transition: border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    }
    .custom-dropdown-trigger:hover {
      border-color: rgba(99, 179, 237, 0.7) !important;
      background: rgba(26, 32, 44, 0.85) !important;
    }
    .custom-dropdown-menu {
      -webkit-app-region: no-drag;
    }
    .custom-dropdown-item {
      -webkit-app-region: no-drag;
      transition: background-color 0.12s ease, color 0.12s ease;
    }
    .custom-dropdown-item:hover {
      background: rgba(255, 255, 255, 0.12) !important;
      color: #fff !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    require('./renderer.js');
  </script>
</body>
</html>
